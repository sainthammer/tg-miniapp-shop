services:
  telegram-shop:
    build: .
    container_name: telegram-shop
    restart: unless-stopped
    labels:
      - "autoheal=true"
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - shop_data:/app/data
      - ./static/uploads:/app/static/uploads
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  shop_data:
