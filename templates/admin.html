<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTINCT — Управление</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  /* ══════════════════════════════════════════
     XTINCT Admin — Scratched Metal Design System
  ══════════════════════════════════════════ */

  :root {
    --m-black:   #090909;
    --m-dark:    #101010;
    --m-mid:     #161616;
    --m-surf:    #1c1c1c;
    --m-border:  rgba(155,157,160,0.15);
    --m-top:     rgba(218,220,224,0.22);
    --m-shine:   rgba(255,255,255,0.06);
    --m-shadow:  rgba(0,0,0,0.58);
    --silver:    #ccd0da;
    --silver-dim: rgba(165,168,176,0.68);
    --silver-faint: rgba(148,150,158,0.44);
    --brass:     #dce4f0;
    --brass-dim: rgba(208,218,240,0.58);
    --danger-bd: rgba(210,70,70,0.32);
    --fn-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --fn-body:    'Barlow', 'Arial', sans-serif;

    --scratch-a: repeating-linear-gradient(
      17deg, transparent 0, transparent 1.6px,
      rgba(255,255,255,0.027) 1.6px, rgba(255,255,255,0.027) 2px);
    --scratch-b: repeating-linear-gradient(
      -9deg, transparent 0, transparent 4px,
      rgba(255,255,255,0.013) 4px, rgba(255,255,255,0.013) 4.4px);
    --scratch-c: repeating-linear-gradient(
      76deg, transparent 0, transparent 9px,
      rgba(255,255,255,0.006) 9px, rgba(255,255,255,0.006) 9.5px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: var(--fn-body);
    background-image:
      var(--scratch-a), var(--scratch-b), var(--scratch-c),
      linear-gradient(rgba(8,8,8,0.78), rgba(8,8,8,0.78)),
      url(/static/metal-bg.jpg);
    background-size: auto, auto, auto, cover, cover;
    background-attachment: fixed;
    background-position: center;
    min-height: 100vh;
    color: var(--silver);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Metal panel ── */
  .glass {
    background:
      var(--scratch-a), var(--scratch-b),
      linear-gradient(160deg, #1e1e1e 0%, #181818 45%, #1a1a1a 100%);
    border: 1px solid var(--m-border);
    border-top-color: var(--m-top);
    border-left-color: rgba(192,194,197,0.18);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -1px 0 rgba(0,0,0,0.40);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  /* ── Border-radius ── */
  .rounded-\[22px\],.rounded-\[24px\],.rounded-\[28px\] { border-radius: 4px !important; }
  .rounded-2xl { border-radius: 4px !important; }
  .rounded-xl  { border-radius: 3px !important; }
  .rounded-full { border-radius: 3px !important; }
  .rounded-lg  { border-radius: 3px !important; }

  /* ── Primary buttons ── */
  .bg-white.text-slate-900 {
    background: linear-gradient(180deg, #1e1e1e, #181818) !important;
    border: 1px solid rgba(140,141,143,0.22) !important;
    border-top-color: rgba(192,195,198,0.26) !important;
    border-bottom-color: rgba(0,0,0,0.28) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05) !important;
    color: var(--silver-dim) !important;
    letter-spacing: 0.12em !important;
    text-transform: uppercase !important;
    font-weight: 700 !important;
    font-family: var(--fn-body) !important;
    font-size: 11px !important;
    transition: filter .12s ease !important;
  }
  .bg-white.text-slate-900:active { filter: brightness(0.88) !important; }

  /* ── Danger buttons ── */
  .bg-red-500\/80, .bg-red-700\/70 {
    background:
      var(--scratch-a),
      linear-gradient(180deg, #5e1414 0%, #3c0c0c 100%) !important;
    border: 1px solid var(--danger-bd) !important;
    border-top-color: rgba(218,75,75,0.42) !important;
    color: #f0b2b2 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.09em !important;
    font-weight: 700 !important;
    font-family: var(--fn-body) !important;
    font-size: 11px !important;
  }

  /* ── Form inputs ── */
  input:not([type=file]), textarea, select {
    background:
      repeating-linear-gradient(17deg, transparent 0, transparent 3px,
        rgba(255,255,255,0.006) 3px, rgba(255,255,255,0.006) 3.4px),
      linear-gradient(to bottom, #0c0c0c, #101010) !important;
    border-color: rgba(140,141,143,0.24) !important;
    border-bottom-color: rgba(192,194,198,0.14) !important;
    color: #dcdeed !important;
    font-family: var(--fn-body) !important;
    font-size: 15px !important;
    letter-spacing: 0.04em !important;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.36) !important;
  }
  input::placeholder, textarea::placeholder {
    color: rgba(155,155,180,0.38) !important;
    letter-spacing: 0.06em;
  }
  select option { background: #141414; color: #dcdce4; }

  /* ── Site header (shared with client) ── */
  .site-header {
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 1px, rgba(255,255,255,0.018) 1px, rgba(255,255,255,0.018) 2px),
      repeating-linear-gradient(12deg, transparent 0, transparent 2.8px, rgba(255,255,255,0.022) 2.8px, rgba(255,255,255,0.022) 3px),
      repeating-linear-gradient(-7deg, transparent 0, transparent 5px, rgba(255,255,255,0.011) 5px, rgba(255,255,255,0.011) 5.3px),
      linear-gradient(100deg, #1a1a1a 0%, #212121 18%, #1d1d1d 35%, #232323 52%, #1c1c1c 68%, #202020 82%, #1b1b1b 100%);
    border: 1px solid rgba(130,132,136,0.22);
    border-top-color: rgba(228,232,238,0.34);
    border-bottom-color: rgba(0,0,0,0.55);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.52),
      inset 0 -1px 0 rgba(0,0,0,0.42),
      0 1px 0 rgba(255,255,255,0.04);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .site-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(220,226,238,0.18) 8%, rgba(235,240,250,0.68) 30%, rgba(242,246,254,0.88) 50%, rgba(235,240,250,0.68) 70%, rgba(220,226,238,0.18) 92%, transparent 100%);
    z-index: 3;
  }
  .site-header::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: -60%; width: 55%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.000) 38%, rgba(255,255,255,0.028) 50%, rgba(255,255,255,0.000) 62%, transparent 100%);
    transform: skewX(-18deg);
    pointer-events: none;
    z-index: 2;
  }
  .site-header__inner {
    position: relative; z-index: 1;
    height: 96px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .site-header__logo {
    height: 58px;
    width: auto;
    filter: invert(1);
    mix-blend-mode: screen;
    flex-shrink: 0;
    pointer-events: none;
    user-select: none;
  }
  /* ── Header action button ── */
  .mgr-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 13px 8px 11px;
    font-family: var(--fn-body);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--silver-dim);
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 1px, rgba(255,255,255,0.012) 1px, rgba(255,255,255,0.012) 2px),
      linear-gradient(175deg, #1c1c1c 0%, #141414 55%, #181818 100%);
    border: 1px solid rgba(130,132,138,0.28);
    border-top-color: rgba(200,208,224,0.30);
    border-bottom-color: rgba(0,0,0,0.44);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 -1px 0 rgba(0,0,0,0.28),
      inset 1px 0 0 rgba(255,255,255,0.02);
    border-radius: 3px; cursor: pointer;
    transition: filter .14s ease, box-shadow .14s ease;
    white-space: nowrap;
  }
  .mgr-btn:hover {
    color: var(--silver);
    border-top-color: rgba(210,220,240,0.42);
    filter: brightness(1.08);
  }
  .mgr-btn:active {
    filter: brightness(0.82);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.42), inset 0 -1px 0 rgba(0,0,0,0.20);
  }

  /* ── Bottom nav ── */
  .nav-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0; z-index: 50;
    padding: 0 12px max(14px, env(safe-area-inset-bottom));
  }
  .nav-inner {
    max-width: 72rem;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: space-around;
    background:
      var(--scratch-a),
      linear-gradient(0deg, #0a0a0a 0%, #141414 100%);
    border: 1px solid var(--m-border);
    border-top-color: var(--m-top);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      0 -3px 20px rgba(0,0,0,0.68);
    border-radius: 4px;
    padding: 6px 8px;
  }
  .nav-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    min-width: 72px; height: 58px;
    border-radius: 3px;
    color: rgba(148,148,172,0.38);
    transition: all .16s ease;
    position: relative;
    background: none; border: none; cursor: pointer;
    font-family: var(--fn-body);
  }
  .nav-btn.active {
    color: var(--silver);
    background:
      var(--scratch-a),
      linear-gradient(180deg, #222222 0%, #181818 100%);
    border: 1px solid rgba(195,210,240,0.22);
    border-top-color: rgba(208,222,244,0.38);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .nav-btn.active::before {
    content: '';
    position: absolute;
    top: -1px; left: 50%;
    transform: translateX(-50%);
    width: 28px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--brass) 35%, var(--brass) 65%, transparent);
    border-radius: 0 0 2px 2px;
  }
  .nav-icon { width: 22px; height: 22px; display: block; }
  .nav-label {
    font-size: 10px; line-height: 1;
    font-weight: 700; letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  /* ── Section form panel ── */
  .form-panel {
    background:
      var(--scratch-a), var(--scratch-b),
      linear-gradient(160deg, #1e1e1e 0%, #181818 100%);
    border: 1px solid var(--m-border);
    border-top-color: var(--m-top);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .form-title {
    font-family: var(--fn-display);
    font-size: 22px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--silver); line-height: 1;
    margin-bottom: 4px;
  }
  .form-sub {
    font-family: var(--fn-body);
    font-size: 12px; color: var(--silver-faint);
    letter-spacing: 0.04em; margin-bottom: 14px;
  }

  /* ── Engraved label ── */
  .engraved {
    font-family: var(--fn-body);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--silver-faint);
  }

  /* ── Scrollbar ── */
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* ── line-clamp ── */
  .line-clamp-2 {
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  </style>
</head>
<body>
  <div class="max-w-6xl mx-auto px-3 pt-3 pb-36">

    <header class="site-header mb-4">
      <div class="site-header__inner">
        <img src="/static/xtinct-logo.png" class="site-header__logo" alt="XTINCT" />
        <button id="openStoreBtn" class="mgr-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V20h14V9.5"></path>
          </svg>
          Магазин
        </button>
      </div>
    </header>

    <section id="ordersScreen">
      <div id="ordersList" class="space-y-3"></div>
    </section>

    <section id="productsScreen" class="hidden">

      <!-- Кнопка-переключатель формы -->
      <button id="toggleAddProductBtn" style="width:100%;margin-bottom:10px;padding:10px 16px;font-family:var(--fn-body);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.22);border-top-color:rgba(192,195,198,0.26);border-bottom-color:rgba(0,0,0,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);border-radius:3px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Добавить товар
      </button>

      <!-- Форма добавления — скрыта по умолчанию -->
      <div id="addProductForm" class="hidden form-panel" style="margin-bottom:12px;">
        <div class="grid md:grid-cols-2 gap-3">
          <input id="newProductTitle" class="rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Название" />
          <input id="newProductPrice" class="rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Цена" />
          <select id="newProductCategory" class="rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none">
            <option value="">Выбери категорию</option>
          </select>
          <input id="newProductSizes" class="rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Размеры: S,M,L" />
        </div>
        <div style="margin-top:12px;">
          <textarea id="newProductDescription" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none min-h-[100px]" placeholder="Описание"></textarea>
        </div>
        <div style="margin-top:12px;">
          <div id="newImageList" class="space-y-2 mb-2"></div>
          <input id="newProductImageFile" type="file" accept="image/*" class="hidden" />
          <button id="addImageBtn" style="font-family:var(--fn-body);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.22);border-top-color:rgba(192,195,198,0.26);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);border-radius:3px;cursor:pointer;padding:8px 14px;">
            + Добавить фото
          </button>
        </div>
        <div style="margin-top:14px;">
          <button id="addProductBtn" class="rounded-2xl bg-white text-slate-900 px-5 py-3 font-semibold">Сохранить товар</button>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <input
          id="productSearchInput"
          class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none"
          placeholder="Поиск по названию"
          autocomplete="off"
        />
      </div>

      <div id="productsList" class="space-y-3"></div>
    </section>

    <section id="categoriesScreen" class="hidden">
      <div class="form-panel">
        <div class="form-title">Категории</div>
        <div class="form-sub">Добавь новую категорию товаров.</div>
        <div class="flex flex-col sm:flex-row gap-3">
          <input id="newCategoryName" class="flex-1 rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Название категории" />
          <button id="addCategoryBtn" class="rounded-2xl bg-white text-slate-900 px-5 py-3 font-semibold">Добавить</button>
        </div>
      </div>
      <div id="categoriesList" class="space-y-3"></div>
    </section>
  </div>

  <!-- Bottom nav -->
  <div id="bottomNavWrap" class="nav-wrap">
    <div class="nav-inner">
      <button id="navOrders" class="nav-btn active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 4h12v16H6z"></path>
          <path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h4"></path>
        </svg>
        <span class="nav-label">Заказы</span>
      </button>
      <button id="navProducts" class="nav-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3 4 7l8 4 8-4-8-4Z"></path>
          <path d="M4 7v10l8 4 8-4V7"></path>
          <path d="M12 11v10"></path>
        </svg>
        <span class="nav-label">Товары</span>
      </button>
      <button id="navCategories" class="nav-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6" cy="6" r="2"></circle>
          <circle cx="18" cy="6" r="2"></circle>
          <circle cx="6" cy="18" r="2"></circle>
          <circle cx="18" cy="18" r="2"></circle>
          <path d="M8 6h8"></path><path d="M6 8v8"></path>
          <path d="M18 8v8"></path><path d="M8 18h8"></path>
        </svg>
        <span class="nav-label">Категории</span>
      </button>
    </div>
  </div>

  <!-- Edit product modal -->
  <div id="editProductModal" class="hidden fixed inset-0 z-[60] p-4 overflow-auto" style="background:rgba(4,4,8,0.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);">
    <div class="max-w-lg mx-auto mt-6 mb-28 glass rounded-[28px] p-5 shadow-2xl">
      <div class="flex items-center justify-between gap-3 mb-5">
        <h2 style="font-family:var(--fn-display);font-size:26px;letter-spacing:0.10em;color:var(--silver);line-height:1;">Редактирование товара</h2>
        <button id="closeEditProductModal" style="color:var(--silver-dim);font-size:20px;background:none;border:none;cursor:pointer;padding:4px;">✕</button>
      </div>
      <div class="space-y-3">
        <input id="editProductTitle" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Название" />
        <input id="editProductPrice" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Цена" />
        <select id="editProductCategory" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none">
          <option value="">Выбери категорию</option>
        </select>
        <input id="editProductSizes" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none" placeholder="Размеры через запятую" />
        <div>
          <div id="editImageList" class="space-y-2 mb-2"></div>
          <input id="editProductImageFile" type="file" accept="image/*" class="hidden" />
          <button id="editAddImageBtn"
            style="font-family:var(--fn-body);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.22);border-top-color:rgba(192,195,198,0.26);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);border-radius:3px;cursor:pointer;padding:10px 14px;">
            + Добавить фото
          </button>
        </div>
        <textarea id="editProductDescription" class="w-full rounded-2xl bg-white/10 border border-white/10 px-4 py-3 outline-none min-h-[110px]" placeholder="Описание"></textarea>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button id="saveEditProductBtn" class="rounded-2xl bg-white text-slate-900 px-5 py-3 font-semibold">Сохранить</button>
        <button id="cancelEditProductBtn" class="rounded-2xl bg-white/10 px-5 py-3 font-semibold"
          style="font-family:var(--fn-body);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.22);border-radius:3px;cursor:pointer;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Order details modal -->
  <div id="orderDetailsModal" class="hidden fixed inset-0 z-[60] p-4 overflow-auto" style="background:rgba(4,4,8,0.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);">
    <div class="max-w-2xl mx-auto mt-6 mb-28 glass rounded-[28px] p-5 shadow-2xl">
      <div class="flex items-center justify-between gap-3 mb-5">
        <h2 style="font-family:var(--fn-display);font-size:26px;letter-spacing:0.10em;color:var(--silver);line-height:1;">Детали заказа</h2>
        <button id="closeOrderDetailsModal" style="color:var(--silver-dim);font-size:20px;background:none;border:none;cursor:pointer;padding:4px;">✕</button>
      </div>
      <div id="orderDetailsContent" class="space-y-3"></div>
      <div class="mt-5 grid grid-cols-2 md:grid-cols-5 gap-2">
        <button onclick="changeStatusFromModal('confirmed')" class="rounded-xl bg-white text-slate-900 px-4 py-3 text-sm font-semibold">Подтвердить</button>
        <button onclick="changeStatusFromModal('processing')" class="rounded-xl bg-white/10 px-4 py-3 text-sm font-medium"
          style="font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.20);border-radius:3px;cursor:pointer;">В обработку</button>
        <button onclick="changeStatusFromModal('shipped')" class="rounded-xl bg-white/10 px-4 py-3 text-sm font-medium"
          style="font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.20);border-radius:3px;cursor:pointer;">Отправлен</button>
        <button onclick="changeStatusFromModal('done')" class="rounded-xl bg-white/10 px-4 py-3 text-sm font-medium"
          style="font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--silver-dim);background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.20);border-radius:3px;cursor:pointer;">Завершён</button>
        <button onclick="changeStatusFromModal('cancelled')" class="rounded-xl bg-red-500/80 px-4 py-3 text-sm font-medium">Отменён</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    document.getElementById('openStoreBtn').addEventListener('click', () => {
      window.location.href = '/';
    });

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    if (!tg?.initData) {
      document.body.innerHTML = `
        <div class="max-w-xl mx-auto px-4 pt-10" style="color:var(--silver);">
          <div class="glass rounded-[24px] p-6">
            <div style="font-family:var(--fn-display);font-size:26px;letter-spacing:0.10em;color:var(--silver);margin-bottom:12px;">Нет Telegram initData</div>
            <div style="font-family:var(--fn-body);font-size:14px;color:var(--silver-dim);letter-spacing:0.03em;">
              Открой админку только через кнопку бота в Telegram. Не открывай /admin вручную и не обновляй страницу как обычный сайт.
            </div>
          </div>
        </div>
      `;
      throw new Error("Missing Telegram initData in admin.html");
    }

    const state = {
      tab: 'orders',
      orders: [],
      products: [],
      categories: [],
      editingProductId: null,
      selectedOrder: null,
    };

    let newProductImages = [];
    let editProductImages = [];

    const ordersScreen = document.getElementById('ordersScreen');
    const productsScreen = document.getElementById('productsScreen');
    const categoriesScreen = document.getElementById('categoriesScreen');

    const navOrders = document.getElementById('navOrders');
    const navProducts = document.getElementById('navProducts');
    const navCategories = document.getElementById('navCategories');

    const editProductModal = document.getElementById('editProductModal');
    const editProductTitle = document.getElementById('editProductTitle');
    const editProductPrice = document.getElementById('editProductPrice');
    const editProductCategory = document.getElementById('editProductCategory');
    const editProductSizes = document.getElementById('editProductSizes');
    const editProductDescription = document.getElementById('editProductDescription');

    const orderDetailsModal = document.getElementById('orderDetailsModal');
    const orderDetailsContent = document.getElementById('orderDetailsContent');

    function headers(isJson = true) {
      const result = {
        "X-Telegram-Init-Data": tg.initData
      };
      if (isJson) {
        result["Content-Type"] = "application/json";
      }
      return result;
    }

    function formatPrice(value) {
      return new Intl.NumberFormat('ru-RU').format(value) + ' ₽';
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).replace('T', ' ');
      return date.toLocaleString('ru-RU');
    }

    function statusLabel(status) {
      const labels = {
        new: 'Новый',
        confirmed: 'Подтвержден',
        processing: 'В обработке',
        shipped: 'Отправлен',
        done: 'Завершен',
        cancelled: 'Отменен',
      };
      return labels[status] || status;
    }

    function setTab(tab) {
      state.tab = tab;

      // Сбрасываем поиск при переключении таба
      const searchInput = document.getElementById('productSearchInput');
      if (searchInput) {
        searchInput.value = '';
      }

      ordersScreen.classList.toggle('hidden', tab !== 'orders');
      productsScreen.classList.toggle('hidden', tab !== 'products');
      categoriesScreen.classList.toggle('hidden', tab !== 'categories');

      [navOrders, navProducts, navCategories].forEach((el) => el.classList.remove('active'));
      if (tab === 'orders') navOrders.classList.add('active');
      if (tab === 'products') navProducts.classList.add('active');
      if (tab === 'categories') navCategories.classList.add('active');

      if (tab !== 'products') {
        document.getElementById('addProductForm').classList.add('hidden');
      }
    }

    async function apiGet(url) {
      const response = await fetch(url, { headers: headers(true) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function apiPost(url, payload = {}) {
      const response = await fetch(url, {
        method: 'POST',
        headers: headers(true),
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadOrders() {
      const data = await apiGet('/api/admin/orders');
      state.orders = data.items;
      renderOrders();
    }

    async function loadProducts() {
      const data = await apiGet('/api/admin/products');
      state.products = data.items;
      renderProducts();
    }

    async function loadCategories() {
      const data = await apiGet('/api/admin/categories');
      state.categories = data.items;
      renderCategories();
    }

    function renderOrders() {
      const root = document.getElementById('ordersList');

      if (!state.orders.length) {
        root.innerHTML = `<div class="glass rounded-[22px] p-6" style="color:var(--silver-dim);font-family:var(--fn-body);font-size:14px;letter-spacing:0.04em;">Заказов пока нет.</div>`;
        return;
      }

      root.innerHTML = state.orders.map(order => `
        <article style="
          background:var(--scratch-a),var(--scratch-b),linear-gradient(160deg,#1e1e1e 0%,#181818 100%);
          border:1px solid var(--m-border);border-top-color:var(--m-top);
          box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
          border-radius:4px;padding:14px;
        ">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;">
            <button onclick="openOrderDetails(${order.order_number})" style="text-align:left;min-width:0;flex:1;background:none;border:none;cursor:pointer;">
              <div style="font-family:var(--fn-display);font-weight:800;font-size:24px;letter-spacing:0.06em;color:var(--silver);line-height:1;">Заказ #${order.order_number}</div>
              <div style="font-family:var(--fn-body);font-size:13px;font-weight:600;color:var(--silver-dim);margin-top:5px;letter-spacing:0.03em;">${esc(order.customer_name || 'Не указано')}</div>
              <div style="font-family:var(--fn-body);font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--brass-dim);margin-top:4px;">${statusLabel(order.status)}</div>
              <div style="font-family:var(--fn-display);font-size:18px;letter-spacing:0.04em;color:var(--silver);margin-top:4px;">${formatPrice(order.total)}</div>
              <div style="font-family:var(--fn-body);font-size:11px;color:var(--silver-faint);margin-top:3px;letter-spacing:0.03em;">${esc(formatDate(order.created_at))}</div>
            </button>
            <div style="display:grid;grid-template-columns:1fr;gap:6px;width:auto;flex-shrink:0;">
              <button onclick="openOrderDetails(${order.order_number})"
                style="background:var(--scratch-a),linear-gradient(180deg,#2e2e2e 0%,#1e1e1e 55%,#242424 100%);border:1px solid rgba(140,141,143,0.40);border-top-color:rgba(218,220,224,0.55);border-bottom-color:rgba(0,0,0,0.48);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);color:var(--silver);font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:8px 14px;border-radius:3px;cursor:pointer;">
                Открыть
              </button>
              <button onclick="changeOrderStatus(${order.order_number}, 'confirmed')"
                style="background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.20);color:var(--silver-dim);font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:8px 14px;border-radius:3px;cursor:pointer;">
                Подтвердить
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    async function openOrderDetails(orderNumber) {
      try {
        const data = await apiGet(`/api/admin/orders/${orderNumber}`);
        state.selectedOrder = data.item;
        renderOrderDetails();
        orderDetailsModal.classList.remove('hidden');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    function closeOrderDetails() {
      state.selectedOrder = null;
      orderDetailsModal.classList.add('hidden');
    }

    function renderOrderDetails() {
      const order = state.selectedOrder;
      if (!order) {
        orderDetailsContent.innerHTML = '';
        return;
      }

      const panelStyle = `
        background:var(--scratch-a),var(--scratch-b),linear-gradient(160deg,#1e1e1e 0%,#181818 100%);
        border:1px solid var(--m-border);border-top-color:var(--m-top);
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);border-radius:4px;padding:14px;
      `;
      const labelStyle = `font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--silver-faint);margin-bottom:5px;`;
      const valueStyle = `font-family:var(--fn-body);font-size:14px;color:var(--silver);letter-spacing:0.02em;`;
      const metaStyle = `font-family:var(--fn-body);font-size:13px;letter-spacing:0.03em;`;

      const itemsHtml = (order.items || []).map(item => `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(155,157,160,0.10);">
          <div>
            <div style="${metaStyle}color:var(--silver);font-weight:600;">${esc(item.title)}</div>
            <div style="${metaStyle}color:var(--silver-dim);margin-top:2px;font-size:12px;">
              Кол-во: ${item.quantity}${item.size ? ` | Размер: ${esc(item.size)}` : ''}
            </div>
          </div>
          <div style="font-family:var(--fn-display);font-weight:800;font-size:18px;letter-spacing:0.04em;color:var(--silver);white-space:nowrap;">${formatPrice(item.subtotal)}</div>
        </div>
      `).join('');

      orderDetailsContent.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div style="${panelStyle}">
            <div style="${labelStyle}">Заказ</div>
            <div style="font-family:var(--fn-display);font-weight:800;font-size:22px;letter-spacing:0.06em;color:var(--silver);">#${order.order_number}</div>
          </div>
          <div style="${panelStyle}">
            <div style="${labelStyle}">Статус</div>
            <div style="font-family:var(--fn-body);font-size:12px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--brass-dim);">${statusLabel(order.status)}</div>
          </div>
        </div>

        <div style="${panelStyle}display:flex;flex-direction:column;gap:7px;">
          <div style="${labelStyle}">Данные заказчика</div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Имя:</span> <span style="color:var(--silver);">${esc(order.customer_name || 'Не указано')}</span></div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Телефон:</span> <span style="color:var(--silver);">${esc(order.customer_phone || 'Не указано')}</span></div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Telegram:</span> <span style="color:var(--silver);">${esc(order.customer_telegram_link || 'Не указано')}</span></div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Комментарий:</span> <span style="color:var(--silver);">${esc(order.customer_comment || '—')}</span></div>
        </div>

        <div style="${panelStyle}display:flex;flex-direction:column;gap:7px;">
          <div style="${labelStyle}">Telegram</div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">User ID:</span> <span style="color:var(--silver);">${esc(String(order.telegram_user_id || '—'))}</span></div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Username:</span> <span style="color:var(--silver);">${order.telegram_username ? '@' + esc(order.telegram_username) : '—'}</span></div>
          <div style="${metaStyle}"><span style="color:var(--silver-faint);">Создан:</span> <span style="color:var(--silver);">${esc(formatDate(order.created_at))}</span></div>
        </div>

        <div style="${panelStyle}">
          <div style="${labelStyle}margin-bottom:10px;">Состав заказа</div>
          <div>${itemsHtml || '<div style="color:var(--silver-faint);">Позиции отсутствуют</div>'}</div>
        </div>

        <div style="${panelStyle}display:flex;align-items:center;justify-content:space-between;">
          <div style="${labelStyle}margin-bottom:0;">Итого</div>
          <div style="font-family:var(--fn-display);font-weight:800;font-size:28px;letter-spacing:0.04em;color:var(--silver);">${formatPrice(order.total || 0)}</div>
        </div>
      `;
    }

    async function changeStatusFromModal(status) {
      if (!state.selectedOrder) return;
      try {
        await apiPost(`/api/admin/orders/${state.selectedOrder.order_number}/status`, { status });
        const updated = await apiGet(`/api/admin/orders/${state.selectedOrder.order_number}`);
        state.selectedOrder = updated.item;
        renderOrderDetails();
        await loadOrders();
        tg?.showAlert?.(`Статус заказа #${state.selectedOrder.order_number} обновлен`);
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    function openEditProductModal(id) {
      const product = state.products.find((item) => item.id === id);
      if (!product) return;

      state.editingProductId = id;
      editProductTitle.value = product.title || '';
      editProductPrice.value = product.price || '';
      editProductCategory.value = product.category || '';
      editProductSizes.value = (product.sizes || []).join(',');
      editProductDescription.value = product.description || '';

      editProductImages = product.images?.length ? [...product.images] : (product.image ? [product.image] : []);
      renderImageList('editImageList', editProductImages);

      editProductModal.classList.remove('hidden');
    }

    function closeEditProductModal() {
      state.editingProductId = null;
      editProductImages = [];
      editProductModal.classList.add('hidden');
    }

    async function saveEditedProduct() {
      if (!state.editingProductId) return;

      if (!editProductImages.length) {
        tg?.showAlert?.('Добавь хотя бы одно фото');
        return;
      }

      const payload = {
        title: editProductTitle.value.trim(),
        price: editProductPrice.value.trim(),
        category: editProductCategory.value.trim(),
        sizes: editProductSizes.value.split(',').map(s => s.trim()).filter(Boolean),
        description: editProductDescription.value.trim(),
        image: editProductImages[0],
        extra_images: editProductImages.slice(1),
      };

      if (!payload.title || !payload.price || !payload.category || !payload.image || !payload.description) {
        tg?.showAlert?.('Заполни все поля товара');
        return;
      }

      try {
        await apiPost(`/api/admin/products/${state.editingProductId}`, payload);
        closeEditProductModal();
        await loadProducts();
        tg?.showAlert?.('Товар обновлен');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    function renderProducts() {
      const root = document.getElementById('productsList');

      // Фильтруем по текущему тексту поиска (case-insensitive)
      const query = (document.getElementById('productSearchInput')?.value || '').trim().toLowerCase();
      const visible = query
        ? state.products.filter(p => p.title.toLowerCase().includes(query))
        : state.products;

      if (!state.products.length) {
        root.innerHTML = `<div class="glass rounded-[22px] p-6" style="color:var(--silver-dim);font-family:var(--fn-body);font-size:14px;letter-spacing:0.04em;">Товаров пока нет.</div>`;
        return;
      }

      if (!visible.length) {
        root.innerHTML = `<div class="glass rounded-[22px] p-6" style="color:var(--silver-dim);font-family:var(--fn-body);font-size:14px;letter-spacing:0.04em;">Ничего не найдено.</div>`;
        return;
      }

      root.innerHTML = visible.map(product => `
        <article style="
          background:var(--scratch-a),var(--scratch-b),linear-gradient(160deg,#1e1e1e 0%,#181818 100%);
          border:1px solid var(--m-border);border-top-color:var(--m-top);
          box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
          border-radius:4px;padding:14px;
          display:flex;gap:12px;align-items:center;flex-wrap:wrap;
        ">
          <img src="${esc(product.image)}" alt="${esc(product.title)}"
            style="width:88px;height:88px;object-fit:cover;border-radius:3px;border:1px solid rgba(155,157,160,0.14);flex-shrink:0;" />

          <div style="flex:1;min-width:0;">
            <div style="font-family:var(--fn-body);font-size:9px;font-weight:700;letter-spacing:0.26em;text-transform:uppercase;color:var(--brass-dim);">${esc(product.category)}</div>
            <div style="font-family:var(--fn-body);font-size:15px;font-weight:700;color:var(--silver);letter-spacing:0.02em;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(product.title)}</div>
            <div style="font-family:var(--fn-display);font-weight:800;font-size:20px;letter-spacing:0.04em;color:var(--silver);margin-top:5px;line-height:1;">${formatPrice(product.price)}</div>
            <div style="font-family:var(--fn-body);font-size:12px;color:var(--silver-faint);margin-top:3px;letter-spacing:0.03em;">Размеры: ${(product.sizes || []).map(esc).join(' · ') || 'не указаны'}</div>
            <div style="font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:${product.is_active ? 'var(--brass-dim)' : 'var(--silver-faint)'};margin-top:3px;">${product.is_active ? '● Активен' : '○ Скрыт'}</div>
          </div>

          <div style="display:grid;grid-template-columns:1fr;gap:5px;min-width:100px;flex-shrink:0;">
            <button onclick="openEditProductModal(${product.id})"
              style="background:var(--scratch-a),linear-gradient(180deg,#2e2e2e 0%,#1e1e1e 55%,#242424 100%);border:1px solid rgba(140,141,143,0.40);border-top-color:rgba(218,220,224,0.55);border-bottom-color:rgba(0,0,0,0.48);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);color:var(--silver);font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:8px 10px;border-radius:3px;cursor:pointer;">
              Изменить
            </button>
            ${product.is_active
              ? `<button onclick="hideProduct(${product.id})"
                  style="background:linear-gradient(180deg,#5e1414 0%,#3c0c0c 100%);border:1px solid rgba(210,70,70,0.32);border-top-color:rgba(218,75,75,0.42);color:#f0b2b2;font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:8px 10px;border-radius:3px;cursor:pointer;">
                  Скрыть
                </button>`
              : `<button onclick="showProduct(${product.id})"
                  style="background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(140,141,143,0.20);color:var(--silver-dim);font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:8px 10px;border-radius:3px;cursor:pointer;">
                  Показать
                </button>`
            }
            <button onclick="deleteProduct(${product.id})"
              style="background:linear-gradient(180deg,#4a0e0e 0%,#2e0808 100%);border:1px solid rgba(210,70,70,0.28);color:#e8a0a0;font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:8px 10px;border-radius:3px;cursor:pointer;">
              Удалить
            </button>
          </div>
        </article>
      `).join('');
    }

    function fillCategorySelects() {
      const options = '<option value="">Выбери категорию</option>' +
        state.categories.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
      document.getElementById('newProductCategory').innerHTML = options;
      document.getElementById('editProductCategory').innerHTML = options;
    }

    function renderImageList(listId, images) {
      const root = document.getElementById(listId);
      if (!images.length) {
        root.innerHTML = '<div style="font-family:var(--fn-body);font-size:12px;color:var(--silver-faint);letter-spacing:0.04em;padding:4px 0;">Фото не добавлены</div>';
        return;
      }
      const prefix = listId === 'newImageList' ? 'removeNewImage' : 'removeEditImage';
      root.innerHTML = images.map((src, i) => `
        <div style="display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1e1e1e,#181818);border:1px solid rgba(138,138,162,0.20);border-radius:3px;padding:8px 10px;">
          <img src="${esc(src)}" style="width:36px;height:36px;border-radius:3px;object-fit:cover;flex-shrink:0;border:1px solid rgba(155,157,160,0.14);" onerror="this.style.opacity='0.3'" />
          <span style="flex:1;font-family:var(--fn-body);font-size:12px;color:var(--silver-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(src.split('/').pop())}</span>
          ${i === 0 ? '<span style="font-family:var(--fn-body);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-dim);border:1px solid var(--brass-dim);padding:2px 6px;border-radius:2px;flex-shrink:0;">главное</span>' : ''}
          <button onclick="${prefix}(${i})" style="color:var(--silver-faint);font-size:18px;background:none;border:none;cursor:pointer;line-height:1;flex-shrink:0;">×</button>
        </div>
      `).join('');
    }

    function removeNewImage(index) {
      newProductImages.splice(index, 1);
      renderImageList('newImageList', newProductImages);
    }

    function removeEditImage(index) {
      editProductImages.splice(index, 1);
      renderImageList('editImageList', editProductImages);
    }

    async function uploadAndAddImage(fileInputId, images, listId) {
      const input = document.getElementById(fileInputId);
      const file = input.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('image', file);
      const response = await fetch('/api/admin/upload-image', {
        method: 'POST',
        headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
        body: formData,
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || 'Upload failed');
      images.push(data.path);
      renderImageList(listId, images);
      input.value = '';
    }

    function renderCategories() {
      const root = document.getElementById('categoriesList');

      if (!state.categories.length) {
        root.innerHTML = `<div class="glass rounded-[22px] p-6" style="color:var(--silver-dim);font-family:var(--fn-body);font-size:14px;letter-spacing:0.04em;">Категорий пока нет.</div>`;
        fillCategorySelects();
        return;
      }

      root.innerHTML = state.categories.map(category => `
        <article style="
          background:var(--scratch-a),var(--scratch-b),linear-gradient(160deg,#1e1e1e 0%,#181818 100%);
          border:1px solid var(--m-border);border-top-color:var(--m-top);
          box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
          border-radius:4px;padding:14px;
          display:flex;align-items:center;justify-content:space-between;gap:12px;
        ">
          <div>
            <div style="font-family:var(--fn-body);font-size:16px;font-weight:700;color:var(--silver);letter-spacing:0.03em;">${esc(category.name)}</div>
            <div style="font-family:var(--fn-body);font-size:11px;color:var(--silver-faint);margin-top:3px;letter-spacing:0.06em;">ID: ${category.id}</div>
          </div>
          <button onclick="deleteCategory(${category.id}, '${esc(category.name)}')"
            style="background:linear-gradient(180deg,#5e1414 0%,#3c0c0c 100%);border:1px solid rgba(210,70,70,0.32);border-top-color:rgba(218,75,75,0.42);color:#f0b2b2;font-family:var(--fn-body);font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:8px 14px;border-radius:3px;cursor:pointer;flex-shrink:0;">
            Удалить
          </button>
        </article>
      `).join('');

      fillCategorySelects();
    }

    async function changeOrderStatus(orderNumber, status) {
      try {
        await apiPost(`/api/admin/orders/${orderNumber}/status`, { status });
        await loadOrders();
        tg?.showAlert?.(`Статус заказа #${orderNumber} обновлен`);
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    async function deleteProduct(productId) {
      tg?.showConfirm('Удалить товар? Это действие необратимо.', async (confirmed) => {
        if (!confirmed) return;
        try {
          await apiPost(`/api/admin/products/${productId}/delete`);
          await loadProducts();
        } catch (error) {
          tg?.showAlert?.(error.message);
        }
      });
    }

    async function deleteCategory(categoryId, categoryName) {
      tg?.showConfirm(`Удалить категорию «${categoryName}»? Это действие необратимо.`, async (confirmed) => {
        if (!confirmed) return;
        try {
          await apiPost(`/api/admin/categories/${categoryId}/delete`);
          await loadCategories();
        } catch (error) {
          tg?.showAlert?.(error.message);
        }
      });
    }

    async function hideProduct(productId) {
      try {
        await apiPost(`/api/admin/products/${productId}/hide`);
        await loadProducts();
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    async function showProduct(productId) {
      try {
        await apiPost(`/api/admin/products/${productId}/show`);
        await loadProducts();
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    }

    document.getElementById('addProductBtn').addEventListener('click', async () => {
      const title = document.getElementById('newProductTitle').value.trim();
      const price = document.getElementById('newProductPrice').value.trim();
      const category = document.getElementById('newProductCategory').value.trim();
      const sizes = document.getElementById('newProductSizes').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      const description = document.getElementById('newProductDescription').value.trim();

      if (!title || !price || !category || !description) {
        tg?.showAlert?.('Заполни все поля товара');
        return;
      }
      if (!newProductImages.length) {
        tg?.showAlert?.('Добавь хотя бы одно фото');
        return;
      }

      try {
        await apiPost('/api/admin/products', {
          title, price, category, sizes, description,
          image: newProductImages[0],
          extra_images: newProductImages.slice(1),
        });

        document.getElementById('newProductTitle').value = '';
        document.getElementById('newProductPrice').value = '';
        document.getElementById('newProductCategory').value = '';
        document.getElementById('newProductSizes').value = '';
        document.getElementById('newProductDescription').value = '';
        newProductImages = [];
        renderImageList('newImageList', newProductImages);

        document.getElementById('addProductForm').classList.add('hidden');
        await loadProducts();
        tg?.showAlert?.('Товар добавлен');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    });

    document.getElementById('addCategoryBtn').addEventListener('click', async () => {
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();

      if (!name) {
        tg?.showAlert?.('Введите название категории');
        return;
      }

      try {
        await apiPost('/api/admin/categories', { name });
        input.value = '';
        await loadCategories();
        tg?.showAlert?.('Категория добавлена');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    });

    navOrders.addEventListener('click', () => setTab('orders'));
    navProducts.addEventListener('click', () => setTab('products'));
    navCategories.addEventListener('click', () => setTab('categories'));

    document.getElementById('toggleAddProductBtn').addEventListener('click', () => {
      const form = document.getElementById('addProductForm');
      form.classList.toggle('hidden');
    });

    // Поиск товаров по названию — клиентская фильтрация без запроса на сервер
    document.getElementById('productSearchInput').addEventListener('input', () => {
      renderProducts();
    });

    document.getElementById('closeEditProductModal').addEventListener('click', closeEditProductModal);
    document.getElementById('cancelEditProductBtn').addEventListener('click', closeEditProductModal);
    document.getElementById('saveEditProductBtn').addEventListener('click', saveEditedProduct);

    document.getElementById('closeOrderDetailsModal').addEventListener('click', closeOrderDetails);

    document.getElementById('addImageBtn').addEventListener('click', () => {
      document.getElementById('newProductImageFile').click();
    });
    document.getElementById('newProductImageFile').addEventListener('change', async () => {
      try {
        await uploadAndAddImage('newProductImageFile', newProductImages, 'newImageList');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    });

    document.getElementById('editAddImageBtn').addEventListener('click', () => {
      document.getElementById('editProductImageFile').click();
    });
    document.getElementById('editProductImageFile').addEventListener('change', async () => {
      try {
        await uploadAndAddImage('editProductImageFile', editProductImages, 'editImageList');
      } catch (error) {
        tg?.showAlert?.(error.message);
      }
    });

    window.changeOrderStatus = changeOrderStatus;
    window.hideProduct = hideProduct;
    window.showProduct = showProduct;
    window.deleteProduct = deleteProduct;
    window.deleteCategory = deleteCategory;
    window.openEditProductModal = openEditProductModal;
    window.openOrderDetails = openOrderDetails;
    window.changeStatusFromModal = changeStatusFromModal;
    window.removeNewImage = removeNewImage;
    window.removeEditImage = removeEditImage;

    (async function init() {
      try {
        setTab('orders');
        try { await loadOrders(); } catch (error) { console.error('loadOrders failed:', error); }
        try { await loadProducts(); } catch (error) { console.error('loadProducts failed:', error); }
        try { await loadCategories(); } catch (error) { console.error('loadCategories failed:', error); }
      } catch (error) {
        console.error('init failed:', error);
      }
    })();
  </script>
</body>
</html>
